<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#BFD7F0">
<title>拾光工作台</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="拾光工作台">
</head>
<body>

  <!-- ===== 主区域 ===== -->
  <div class="app">
    <header class="topbar">
      <button id="menuBtn" class="menu-btn" title="打开菜单">☰</button>
      <div class="top-mid">
        <div id="pageTitle" class="top-title">首页</div>
        <div id="topDate" class="top-date"></div>
      </div>
      <div class="top-spacer"></div>
    </header>
    <main id="content" class="content"></main>
  </div>

  <!-- ===== 左侧抽屉导航 ===== -->
  <aside id="drawer" class="drawer">
    <button id="closeDrawerBtn" class="drawer-close" title="关闭菜单">×</button>

    <!-- 品牌：兔子 + 蝴蝶 + 花朵 -->
    <div class="drawer-brand">
      <div class="brand-logo">
        <svg class="logo-rabbit" width="92" height="92" viewBox="0 0 100 100">
          <!-- 耳朵 -->
          <ellipse cx="38" cy="27" rx="9" ry="25" fill="#FFFFFF" stroke="#5A9FE8" stroke-width="2.5" transform="rotate(-9 38 27)"/>
          <ellipse cx="62" cy="27" rx="9" ry="25" fill="#FFFFFF" stroke="#5A9FE8" stroke-width="2.5" transform="rotate(9 62 27)"/>
          <ellipse cx="38" cy="29" rx="4" ry="15" fill="#FFD9E0" transform="rotate(-9 38 29)"/>
          <ellipse cx="62" cy="29" rx="4" ry="15" fill="#FFD9E0" transform="rotate(9 62 29)"/>
          <!-- 头 -->
          <circle cx="50" cy="63" r="26" fill="#FFFFFF" stroke="#5A9FE8" stroke-width="2.5"/>
          <!-- 眼睛 -->
          <circle cx="41" cy="59" r="3.2" fill="#2C3E50"/>
          <circle cx="59" cy="59" r="3.2" fill="#2C3E50"/>
          <circle cx="42.2" cy="57.8" r="1" fill="#FFFFFF"/>
          <circle cx="60.2" cy="57.8" r="1" fill="#FFFFFF"/>
          <!-- 腮红 -->
          <ellipse cx="33" cy="67" rx="4.2" ry="2.6" fill="#FFD9E0"/>
          <ellipse cx="67" cy="67" rx="4.2" ry="2.6" fill="#FFD9E0"/>
          <!-- 鼻子和嘴 -->
          <path d="M46.5 64.5 L53.5 64.5 L50 68.5 Z" fill="#FFB8C0"/>
          <path d="M50 68.5 Q46 72.5 43 69.5" stroke="#2C3E50" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <path d="M50 68.5 Q54 72.5 57 69.5" stroke="#2C3E50" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        </svg>
        <svg class="logo-bfly" width="26" height="24" viewBox="0 0 26 24">
          <ellipse cx="7" cy="8" rx="6" ry="5" fill="#FFD9E0" transform="rotate(-22 7 8)"/>
          <ellipse cx="19" cy="8" rx="6" ry="5" fill="#FFD9E0" transform="rotate(22 19 8)"/>
          <ellipse cx="9" cy="16" rx="4" ry="3.5" fill="#A8CFF0" transform="rotate(-16 9 16)"/>
          <ellipse cx="17" cy="16" rx="4" ry="3.5" fill="#A8CFF0" transform="rotate(16 17 16)"/>
          <rect x="12" y="6" width="2" height="11" rx="1" fill="#5A9FE8"/>
          <path d="M12.4 5 Q10 2 8 1.5 M13.6 5 Q16 2 18 1.5" stroke="#5A9FE8" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        </svg>
        <svg class="logo-flower" width="20" height="20" viewBox="0 0 20 20">
          <circle cx="10" cy="5.5" r="3.4" fill="#F7D794"/>
          <circle cx="5.5" cy="10" r="3.4" fill="#F7D794"/>
          <circle cx="14.5" cy="10" r="3.4" fill="#F7D794"/>
          <circle cx="7.2" cy="14.2" r="3.4" fill="#F7D794"/>
          <circle cx="12.8" cy="14.2" r="3.4" fill="#F7D794"/>
          <circle cx="10" cy="10" r="2.8" fill="#FFFFFF"/>
          <circle cx="10" cy="10" r="1.3" fill="#F7C08A"/>
        </svg>
      </div>
      <div class="brand-name">拾光工作台
        <svg width="17" height="17" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.9-10-9.5C.5 8 3 4.5 6.5 4.5c2 0 3.8 1.2 5.5 3 1.7-1.8 3.5-3 5.5-3 3.5 0 6 3.5 4.5 7C19.5 16.1 12 21 12 21Z" fill="#FFB8C0"/></svg>
      </div>
      <div class="brand-sub">· 让每一天都被看见 ·</div>
    </div>

    <!-- 波浪虚线（上） -->
    <svg class="wave-line" viewBox="0 0 300 14" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 7 Q12.5 1 25 7 T50 7 T75 7 T100 7 T125 7 T150 7 T175 7 T200 7 T225 7 T250 7 T275 7 T300 7"
            fill="none" stroke="#5A9FE8" stroke-width="2" stroke-dasharray="7 6" stroke-linecap="round"/>
    </svg>

    <!-- 菜单：六大模块 -->
    <ul id="navList" class="drawer-nav">
      <li data-page="home"        class="active">🏠 首页</li>
      <li data-page="english">📚 每日英语</li>
      <li data-page="fitness">🏃 健身</li>
      <li data-page="expense">💰 消费</li>
      <li data-page="todo">✅ 每日待办</li>
      <li data-page="recipe">🍱 一周食谱</li>
      <li data-page="anniversary">🎂 纪念日</li>
      <li data-page="settings" class="settings-item">⚙️ 设置</li>
    </ul>

    <!-- 波浪虚线（下） + 郁金香 -->
    <svg class="wave-line" viewBox="0 0 300 14" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 7 Q12.5 1 25 7 T50 7 T75 7 T100 7 T125 7 T150 7 T175 7 T200 7 T225 7 T250 7 T275 7 T300 7"
            fill="none" stroke="#5A9FE8" stroke-width="2" stroke-dasharray="7 6" stroke-linecap="round"/>
    </svg>

    <div class="drawer-foot">
      <svg width="38" height="46" viewBox="0 0 40 48" aria-hidden="true">
        <path d="M20 44 L20 18" stroke="#7BC4B8" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M20 33 Q10 30 7 23 Q15 24 20 31 Z" fill="#7BC4B8"/>
        <path d="M20 28 Q30 25 33 18 Q25 19 20 26 Z" fill="#7BC4B8"/>
        <path d="M12 9 Q16 3 20 8 Q24 3 28 9 Q28 16 20 20 Q12 16 12 9 Z" fill="#FFB8C0"/>
        <path d="M20 8 L20 20" stroke="#F09AA6" stroke-width="1.5"/>
      </svg>
      <div class="foot-text">拾光工作台 · v2.3</div>
    </div>
  </aside>

  <!-- 遮罩 -->
  <div id="overlay" class="overlay"></div>

  <!-- 弹窗（底部抽屉式） -->
  <div id="modalOverlay" class="modal-overlay">
    <div id="modalBox" class="modal-box"></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js', { scope: './' })
      .then(reg => console.log('SW registered'))
      .catch(err => console.log('SW failed', err));
  }
</script>
</body>
</html>
